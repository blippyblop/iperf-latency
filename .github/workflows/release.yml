name: Release binaries

# Builds statically-linked iperf-latency binaries for linux x86_64/aarch64 and
# (best effort) windows x86_64, and attaches them to the GitHub release that
# triggered the run. workflow_dispatch exists to test the build steps without
# cutting a release (it can't attach assets to a release).

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build-linux:
    name: linux ${{ matrix.arch }} (musl static)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install musl toolchain
        run: |
          sudo apt-get -y update
          sudo apt-get install -y musl-tools file

      - name: Configure (musl, static, no OpenSSL)
        run: |
          CC=musl-gcc CFLAGS="-O2 -static" LDFLAGS="-static" \
            ./configure --with-openssl=no --enable-static-bin

      - name: Build
        run: |
          make -j"$(nproc)"
          file src/iperf-latency
          file src/iperf-latency | grep -Eqi 'statically linked|static-pie' || {
            echo "ERROR: src/iperf-latency is not a static binary" >&2
            exit 1
          }

      # Runs the real end-to-end latency path on native hardware and fails the
      # job on absurd values (the clock-domain bug produced ~1e8 ms constants).
      - name: Smoke test (localhost UDP --measure-latency)
        run: |
          ./src/iperf-latency --version
          ./src/iperf-latency -s -1 >/tmp/server.log 2>&1 &
          sleep 1
          ./src/iperf-latency -c 127.0.0.1 -u -t 4 --measure-latency | tee /tmp/client.log
          grep -q 'PACKET LATENCY' /tmp/client.log
          min_ms=$(awk '/^Minimum:/{print $2}' /tmp/client.log | head -1)
          awk -v v="${min_ms:-1e9}" 'BEGIN { if (v <= 0 || v >= 1000) exit 1 }'

      - name: Stage artifact
        run: cp src/iperf-latency "iperf-latency-linux-${{ matrix.arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iperf-latency-linux-${{ matrix.arch }}
          path: iperf-latency-linux-${{ matrix.arch }}
          if-no-files-found: error

  # Native Windows build (mingw-w64 via MSYS2). The source tree carries the
  # WIN32 port (src/windows/ shims + portable fixes); this job builds it and
  # actually RUNS the end-to-end latency smoke test on real Windows.
  build-windows:
    name: windows x86_64 (mingw-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSYS2 / mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: git file
          pacboy: >-
            toolchain:p
            make:p

      - name: Configure (mingw-w64, static, no OpenSSL)
        run: |
          ./configure --with-openssl=no --enable-static-bin --disable-dependency-tracking \
            CPPFLAGS="-D_WIN32_WINNT=0x0601 -Isrc/windows" \
            LDFLAGS="-static" \
            LIBS="-lws2_32"

      - name: Build
        run: |
          make -j"$(nproc)"
          file src/iperf-latency.exe
          file src/iperf-latency.exe | grep -Eqi 'statically linked|static-pie' || {
            echo "ERROR: src/iperf-latency.exe is not a static binary" >&2
            exit 1
          }

      # Runs the real end-to-end latency path on actual Windows and fails the
      # job on absurd values (the clock-domain bug produced ~1e8 ms constants).
      - name: Smoke test (localhost UDP --measure-latency)
        run: |
          ./src/iperf-latency.exe --version
          ./src/iperf-latency.exe -s -1 >/dev/null 2>&1 &
          sleep 1
          ./src/iperf-latency.exe -c 127.0.0.1 -u -t 4 --measure-latency | tee client.log
          grep -q 'PACKET LATENCY' client.log
          min_ms=$(awk '/^Minimum:/{print $2}' client.log | head -1)
          awk -v v="${min_ms:-1e9}" 'BEGIN { if (v <= 0 || v >= 1000) exit 1 }'

      - name: Stage artifact
        run: cp src/iperf-latency.exe iperf-latency-windows-x86_64.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iperf-latency-windows-x86_64
          path: iperf-latency-windows-x86_64.exe
          if-no-files-found: error

  release-upload:
    name: Attach binaries to the release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: iperf-latency-linux-*
          merge-multiple: true
          path: dist

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          pattern: iperf-latency-windows-*
          merge-multiple: true
          path: dist

      - name: Checksum and attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          chmod +x iperf-latency-* || true
          sha256sum iperf-latency-linux-* > SHA256SUMS
          cat SHA256SUMS
          if [ -f iperf-latency-windows-x86_64.exe ]; then
            sha256sum iperf-latency-windows-x86_64.exe >> SHA256SUMS
          fi
          gh release upload "$RELEASE_TAG" iperf-latency-* SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
